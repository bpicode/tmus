version: 2

builds:
  - id: linux
    main: .
    binary: tmus
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
  - id: darwin
    main: .
    binary: tmus
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: windows
    main: .
    binary: tmus
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w
archives:
  - files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
nfpms:
  - id: linux-packages
    package_name: tmus
    maintainer: bpicode <bpicode@github>
    vendor: bpicode
    homepage: https://github.com/bpicode/tmus
    description: Terminal Music Player
    license: GPL-3.0
    formats:
      - deb
      - rpm
    contents:
      - src: packaging/tmus.desktop
        dst: /usr/share/applications/tmus.desktop
      - src: packaging/icons/hicolor/48x48/apps/tmus.png
        dst: /usr/share/icons/hicolor/48x48/apps/tmus.png
      - src: packaging/icons/hicolor/256x256/apps/tmus.png
        dst: /usr/share/icons/hicolor/256x256/apps/tmus.png
      - src: packaging/icons/hicolor/512x512/apps/tmus.png
        dst: /usr/share/icons/hicolor/512x512/apps/tmus.png
      - src: packaging/completions/tmus.bash
        dst: /usr/share/bash-completion/completions/tmus
        file_info:
          mode: 0644
      - src: packaging/completions/tmus.fish
        dst: /usr/share/fish/vendor_completions.d/tmus.fish
        file_info:
          mode: 0644
      - src: packaging/completions/tmus.zsh
        dst: /usr/share/zsh/site-functions/_tmus
        packager: rpm
        file_info:
          mode: 0644
      - src: packaging/completions/tmus.zsh
        dst: /usr/share/zsh/vendor-completions/_tmus
        packager: deb
        file_info:
          mode: 0644
      - src: packaging/manpages/*.1.gz
        dst: /usr/share/man/man1/
        file_info:
          mode: 0644
      - src: packaging/apparmor/usr.bin.tmus
        dst: /etc/apparmor.d/usr.bin.tmus
        type: "config|noreplace"
        file_info:
          mode: 0644
      - src: packaging/debian/copyright
        dst: /usr/share/doc/tmus/copyright
        packager: deb
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/tmus/LICENSE
        packager: rpm
        file_info:
          mode: 0644
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/licenses/tmus/THIRD_PARTY_NOTICES.md
        packager: rpm
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
    dependencies:
      - libasound2
checksum:
  name_template: "checksums.txt"
