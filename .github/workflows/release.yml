name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail if no tag
        if: ${{ github.ref_type != 'tag' }}
        run: exit 1
      - name: Import GPG key
        run: |
          echo "${{ secrets.MAINTAINER_PUBLIC_KEY }}" | gpg --import
      - name: Verify tag signature
        run: |
          git fetch --tags --force
          git verify-tag "${GITHUB_REF_NAME}"
      - name: Extract release notes
        run: |
          release_notes_file="${RUNNER_TEMP}/release-notes.md"
          git for-each-ref \
            --format='%(contents:body)' \
            "refs/tags/${GITHUB_REF_NAME}" \
            > "${release_notes_file}"

          if ! grep -q '[^[:space:]]' "${release_notes_file}"; then
            echo "::error title=Missing release notes::Tag ${GITHUB_REF_NAME} has no release notes in its message body."
            exit 1
          fi
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Assets
        run: |
          make icons
          make notices
          make completions
          make manpages
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
